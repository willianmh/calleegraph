# Calleegraph frontend — static SPA + a reverse proxy for the API.
#
# Compose (root `docker-compose.yml`) publishes this container as 8080:80 and
# runs the API as service `backend` on port 8000, so `/api` is proxied to
# http://backend:8000/api. The path is preserved: the backend mounts its
# routes under `/api` itself.

upstream calleegraph_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is a secret, but there is no reason to advertise the version.
    server_tokens off;

    # --- the SSE stream ----------------------------------------------------
    # This location must come before the generic /api block so it wins.
    # An event stream that nginx buffers looks exactly like a backend that
    # never sends anything: the connection dot would sit on "connecting" and
    # no live update would ever land. Hence: no buffering, no caching, no
    # proxy-level gzip, HTTP/1.1 with the connection held open, and a read
    # timeout far longer than the backend's keep-alive comment interval.
    location = /api/events/stream {
        proxy_pass http://calleegraph_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header Accept-Encoding '';

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        send_timeout 24h;

        add_header X-Accel-Buffering no always;
        add_header Cache-Control 'no-cache, no-transform' always;
    }

    # --- the rest of the API ----------------------------------------------
    location /api/ {
        proxy_pass http://calleegraph_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- static assets -----------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control 'public, immutable' always;
        try_files $uri =404;
    }

    # Self-hosted fonts, likewise hashed by the build.
    location ~* \.(woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable' always;
        try_files $uri =404;
    }

    # --- the SPA -----------------------------------------------------------
    # Client routing means /repositories and /settings are not files on disk;
    # every unmatched path returns index.html. The shell itself is never
    # cached, so a redeploy is picked up on the next load.
    location / {
        add_header Cache-Control 'no-cache' always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
